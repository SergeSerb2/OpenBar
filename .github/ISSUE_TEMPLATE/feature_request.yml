name: Feature request
description: Suggest an improvement to OpenBar's app, widgets, or CLI.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        New features need the maintainer's sign-off before anyone writes code; see
        [VISION.md](https://github.com/SergeSerb2/OpenBar/blob/main/VISION.md). For a new provider, use the provider
        request form instead.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe what you are trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like OpenBar to do?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Menu bar icon
        - Menu
        - Settings
        - Widgets
        - Notifications
        - CLI
        - Usage & Spend
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
